name: Extract project zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit source
        run: |
          unzip -o saffron-slate-erp.zip
          rm saffron-slate-erp.zip
          rm .github/workflows/extract.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add Saffron & Slate ERP source" || echo "nothing to commit"
          git push
